name: 部署到 EdgeOne Pages

# 触发方式：
#   1. 推送到 main 分支自动部署（生产环境）
#   2. 在 GitHub 仓库 Actions 页面手动点击运行
#
# 使用前必须配置两个东西：
#   - Secrets: EDGEONE_API_TOKEN  （EdgeOne 控制台生成的 API Token）
#   - 下方 env.EDGEONE_PROJECT_NAME 改成你在 EdgeOne 控制台创建的项目名
#
# 如果你已经在 EdgeOne 控制台直接关联了 GitHub 仓库（推送即自动构建部署），
# 那么这个工作流是多余的，可以删除本文件，避免重复部署。

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # TODO: 改成你的 EdgeOne Makers 项目名（控制台项目列表里显示的名称）
  EDGEONE_PROJECT_NAME: navbox

jobs:
  deploy:
    name: 构建并部署
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 EdgeOne CLI
        run: npm install -g edgeone

      - name: 部署到生产环境
        env:
          # GitHub 会自动在日志中遮蔽 secret 的值，但仍不要把它打印出来
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          if [ -z "$EDGEONE_API_TOKEN" ]; then
            echo "错误：未配置 EDGEONE_API_TOKEN。"
            echo "请到仓库 Settings → Secrets and variables → Actions 添加该密钥。"
            echo "Token 获取方式：EdgeOne 控制台 → API Token → 创建 Token"
            exit 1
          fi
          edgeone makers deploy -n "$EDGEONE_PROJECT_NAME" -t "$EDGEONE_API_TOKEN"

      - name: 部署完成提示
        run: |
          echo "部署命令已执行完成。"
          echo "请到 EdgeOne 控制台 → 项目 → 部署记录 查看本次构建结果与访问地址。"
          echo "注意：本项目依赖 KV 存储，请确认已在控制台为该项目绑定命名空间（变量名 NAV_KV）。"
